<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play Word Connect · WordFolio</title>
<meta name="description" content="Word Connect, a relaxing word puzzle game by Grafton Pixel Studio. Get it on the App Store or Google Play.">
<script>
  // The link players share from the game: each visitor goes to their own store; anyone else sees both below
  (function () {
    var appStore = "https://apps.apple.com/app/id6837445930";
    var googlePlay = "https://play.google.com/store/apps/details?id=com.graftonpixel.game.puzzle.wordfolio.wordconnect";
    var agent = navigator.userAgent || "";
    // iPadOS reports itself as a Mac, told apart by its touch screen
    var isIos = /iPhone|iPad|iPod/.test(agent) || (/Macintosh/.test(agent) && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/.test(agent);
    if (isIos) { location.replace(appStore); }
    else if (isAndroid) { location.replace(googlePlay); }
  })();
</script>
<style>
  :root { --bg: #fbfaf7; --fg: #1f2421; --muted: #5d655f; --line: #e1e3dd; --accent: #2f6f5e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151917; --fg: #e5ebe7; --muted: #9ba7a0; --line: #2b3430; --accent: #7cc8b1; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.65 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 20px 64px; }
  h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 4px; }
  .meta { color: var(--muted); margin: 0 0 24px; }
  .stores { display: flex; flex-wrap: wrap; gap: 12px; margin: 24px 0; }
  .stores a { display: inline-block; padding: 12px 20px; border: 1px solid var(--line); border-radius: 10px; color: var(--fg); text-decoration: none; font-weight: 600; }
  .stores a:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<main>
<h1>Word Connect</h1>
<p class="meta">A relaxing word puzzle game by WordFolio · Grafton Pixel Studio</p>
<p>Get the game on your phone or tablet:</p>
<div class="stores">
  <a href="https://apps.apple.com/app/id6837445930">Download on the App Store</a>
  <a href="https://play.google.com/store/apps/details?id=com.graftonpixel.game.puzzle.wordfolio.wordconnect">Get it on Google Play</a>
</div>
</main>
</body>
</html>
